spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/friendsbet
    username: friendsbet
    password: devpass
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: public
management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    env:
      show-values: ALWAYS
odds:
  sportKeys: baseball_mlb,basketball_nba,icehockey_nhl,americanfootball_nfl
  refreshMillis: 180000

