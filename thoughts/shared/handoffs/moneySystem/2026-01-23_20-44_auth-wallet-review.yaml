questions:
  - Should refresh token lifetime be reduced from 14 days to 7 days?
  - Should we add refresh token family tracking for reuse attack detection?

decisions:
  - cooldown_for_refresh: Added 1-second cooldown after token refresh to prevent race condition where multiple 401s could trigger duplicate refreshes
  - unsafe_jti_extraction: Added extractJtiUnsafe() to extract JTI from expired/invalid tokens so logout always revokes in DB

findings:
  - auth_tokens: Access token is 15min (in-memory only), refresh token is 14 days (HttpOnly cookie + DB-backed) - user thought it was 7 days
  - refresh_rotation: Refresh tokens are single-use and rotate on each refresh (good security)
  - wallet_locking: Wallet operations use PESSIMISTIC_WRITE locking - prevents race conditions
  - escrow_model: Bet stakes are debited immediately on propose/accept, held in escrow, paid out on settlement
  - integer_cents: Balances stored as long balanceCents to avoid floating-point errors
  - no_db_constraint: No CHECK constraint on balance_cents >= 0, only application-level validation

