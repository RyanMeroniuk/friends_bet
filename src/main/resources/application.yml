spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: friends_bet
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/friendsbet}
    username: ${SPRING_DATASOURCE_USERNAME:friendsbet}
    password: ${SPRING_DATASOURCE_PASSWORD:devpass}
  jpa:
    hibernate:
      ddl-auto: validate
server:
  error:
    include-stacktrace: never
    include-message: never
jwt:
  # Base64-encoded HS256 secret (do not commit the secret value).
  secret: ${JWT_SECRET_B64:dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3Q=}

admin:
  # Optional: when set, required as `X-Admin-Secret` for `/api/admin/**`.
  secret: ${ADMIN_SECRET:}

odds:
  source: theoddsapi
  apiKey: ${ODDS_API_KEY:}
  regions: us
  markets: [h2h, spreads, totals]
  sport:
    nba: basketball_nba
    nfl: americanfootball_nfl
  sportKeys: americanfootball_nfl,americanfootball_ncaaf,basketball_nba,basketball_ncaab,baseball_mlb,icehockey_nhl,soccer_epl,soccer_usa_mls,soccer_uefa_champs_league,soccer_spain_la_liga,mma_mixed_martial_arts,boxing_boxing
  refreshMillis: 180000
