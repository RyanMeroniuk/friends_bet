spring:
  application:
    name: friends_bet
jwt:
  # Base64-encoded HS256 secret (do not commit the secret value).
  secret: ${JWT_SECRET_B64}

admin:
  # Optional: when set, required as `X-Admin-Secret` for `/api/admin/**`.
  secret: ${ADMIN_SECRET:}

odds:
  source: theoddsapi
  apiKey: ${ODDS_API_KEY}
  regions: us
  markets: [h2h, spreads, totals]
  sport:
    nba: basketball_nba
    nfl: americanfootball_nfl
  sportKeys: basketball_nba,americanfootball_nfl,baseball_mlb,icehockey_nhl
  refreshMillis: 180000
